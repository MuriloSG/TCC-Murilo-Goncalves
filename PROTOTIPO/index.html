/* ---------- Logo institucional (SVG inline, recriado) ---------- */
function logoMark(size=34){
  const u=21, s=16, r=3;
  const greens=[[1,0],[2,0],[0,1],[1,1],[0,2],[1,2],[2,2],[0,3],[1,3]];
  let rects = greens.map(([c,rw])=>`<rect x="${c*u}" y="${rw*u}" width="${s}" height="${s}" rx="${r}" fill="#2D9E3F"/>`).join('');
  return `<svg width="${size}" height="${size*( (4*u-5)/(3*u-5) )}" viewBox="0 0 ${3*u-5} ${4*u-5}" aria-hidden="true">
    <circle cx="8" cy="8" r="8" fill="#CF171F"/>${rects}</svg>`;
}
function logoFull(scale=1){
  return `<div class="flex items-center gap-3 select-none">
    ${logoMark(34*scale)}
    <div class="leading-tight">
      <div class="font-extrabold tracking-tight text-if-ink" style="font-size:${15*scale}px;letter-spacing:-.01em">INSTITUTO FEDERAL</div>

}

/* ---------- Dropdown customizado (substitui <select> em todos os navegadores) ---------- */
const _attr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
function ddField(value, options, onChange, opts={}){
  const { id='', cls='' } = opts;
  const norm = options.map(o=>Array.isArray(o)?{v:String(o[0]),l:o[1],d:!!o[2]}:{v:String(o.v),l:o.l,d:!!o.d});
  const cur = norm.find(o=>o.v===String(value));
  const label = cur?cur.l:(value||'Selecione');
  const oc = onChange?` data-onchange="${_attr(onChange)}"`:'';
  return `<div class="dd ${cls}" data-value="${_attr(value)}"${oc}>
    ${id?`<input type="hidden" id="${id}" value="${_attr(value)}">`:''}
    <button type="button" class="dd-btn" onclick="DD.toggle(this)" aria-haspopup="listbox">
      <span class="dd-label">${label}</span><span class="dd-chev">${icon('chevron','w-4 h-4')}</span>
    </button>
    <div class="dd-panel" role="listbox">
      ${norm.map(o=>`<button type="button" class="dd-opt" role="option" aria-selected="${o.v===String(value)}" ${o.d?'disabled':`data-value="${_attr(o.v)}" onclick="DD.pick(this)"`}>
        <span class="dd-opt-label">${o.l}</span><span class="dd-check">${icon('check','w-4 h-4')}</span></button>`).join('')}
    </div>
  </div>`;
}
const DD = {
  open:null, panel:null,
  toggle(btn){
    const dd=btn.closest('.dd');
    if(DD.open===dd){ DD.close(); return; }
    DD.close();
    const panel=dd.querySelector('.dd-panel') || dd._panel;
    dd._panel=panel; panel._dd=dd;
    document.body.appendChild(panel);   // portal: fora de ancestrais com transform
    panel.classList.add('dd-open'); dd.classList.add('open');
    DD.open=dd; DD.panel=panel;
    const r=btn.getBoundingClientRect();
    panel.style.minWidth=r.width+'px';
    panel.style.left=Math.max(8, Math.min(r.left, window.innerWidth - Math.max(r.width,200) - 8))+'px';
    const ph=panel.offsetHeight; let top=r.bottom+4;
    if(top+ph > window.innerHeight-8) top=Math.max(8, r.top-ph-4);
    panel.style.top=top+'px';
  },
  close(){
    if(DD.panel){ DD.panel.classList.remove('dd-open'); if(DD.open) DD.open.appendChild(DD.panel); }
    if(DD.open){ DD.open.classList.remove('open'); }
    DD.open=null; DD.panel=null;
  },
  pick(opt){
    const panel=opt.closest('.dd-panel'); const dd=panel._dd; const v=opt.dataset.value;
    dd.dataset.value=v;
    dd.querySelector('.dd-label').textContent=opt.querySelector('.dd-opt-label').textContent;
    const hid=dd.querySelector('input[type=hidden]'); if(hid) hid.value=v;
    panel.querySelectorAll('.dd-opt').forEach(o=>o.setAttribute('aria-selected', String(o===opt)));
    DD.close();
    const ex=dd.getAttribute('data-onchange');
    if(ex){ try{ (0,eval)(ex.split('$V').join(JSON.stringify(v))); }catch(e){ console.error(e); } }
  }
};
window.DD=DD; window.ddField=ddField;
document.addEventListener('click', e=>{ if(DD.open && !e.target.closest('.dd') && !e.target.closest('.dd-panel')) DD.close(); });
window.addEventListener('scroll', ()=>DD.close(), true);
window.addEventListener('resize', ()=>DD.close());

    <!-- Main -->

      <!-- Topbar -->
      <header class="bg-white border-b border-if-slate-200 sticky top-0 z-30">
        <div class="px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
          <div class="lg:hidden">${logoFull(.85)}</div>

/* reserva (aprovada/pendente) que ocupa uma célula */
function findReserva(esp,dia,slot){

}

const DIA_FULL = { Seg:'Segunda-feira', Ter:'Terça-feira', Qua:'Quarta-feira', Qui:'Quinta-feira', Sex:'Sexta-feira' };
const DIA_DATA = { Seg:'08/06/2026', Ter:'09/06/2026', Qua:'10/06/2026', Qui:'11/06/2026', Sex:'12/06/2026' };

/* detalhes de um evento do calendário (aula ou reserva) — clique abre modal */
function openEventoDetalhe(espacoId, dia, startSlot, endSlot, st){
  const e = espacos.find(x=>x.id===espacoId)||{};
  const horario = `${startSlot} às ${SLOT_TIMES[endSlot]}`;
  const row = (ic,label,val)=>`<div class="flex items-start gap-3 px-6 py-3 border-b border-if-slate-100 last:border-0">
    <span class="flex-none w-8 h-8 rounded-lg bg-if-slate-50 text-if-slate-500 flex items-center justify-center">${icon(ic,'w-4 h-4')}</span>
    <div class="min-w-0"><div class="text-[11px] font-bold uppercase tracking-wide text-if-slate-400">${label}</div><div class="text-sm font-semibold text-if-ink">${val}</div></div>
  </div>`;
  let head, badgeHtml, rows, icHead, clHead;
  if(st==='aula'){
    const a = ocupacaoAulas[`${espacoId}|${dia}|${startSlot}`]||{};
    head = a.disc; icHead='building'; clHead='bg-if-slate-100 text-if-slate-600';
    badgeHtml = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-if-slate-100 text-if-slate-600 ring-1 ring-if-slate-200">Aula regular · grade institucional</span>`;
    rows = row('building','Espaço',`${e.nome} · ${e.bloco}`)
         + row('calendar','Data',`${DIA_FULL[dia]}, ${DIA_DATA[dia]}`)
         + row('clock','Horário',horario)
         + row('users','Professor',a.prof||'—')
         + row('users','Turma',a.turma||'—');
  } else {
    const r = findReserva(espacoId,dia,startSlot)||{};
    head = r.titulo||'Reserva'; icHead='calendar';
    clHead = st==='aprovada'?'bg-if-green-50 text-if-green-700':'bg-if-amber-50 text-if-amber';
    badgeHtml = badge(r.status||st);
    rows = row('building','Espaço',`${e.nome} · ${e.bloco}`)
         + row('calendar','Data',`${DIA_FULL[dia]}, ${DIA_DATA[dia]}`)
         + row('clock','Horário',horario)
         + row('users','Solicitante',userNome(r.docente))
         + (r.criada?row('clock','Solicitada em',r.criada):'')
         + (r.motivo?row('x','Motivo',r.motivo):'');
  }
  openModal(`
    <div class="px-6 py-5 border-b border-if-slate-100 flex items-start gap-3">
      <span class="flex-none w-11 h-11 rounded-xl ${clHead} flex items-center justify-center">${icon(icHead)}</span>
      <div class="flex-1 min-w-0"><h3 class="font-bold text-lg leading-tight">${head}</h3><div class="mt-1.5">${badgeHtml}</div></div>
      <button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink flex-none">${icon('x')}</button>
    </div>
    <div>${rows}</div>
  `,'max-w-md');
}
window.openEventoDetalhe = openEventoDetalhe;

/* Agenda semanal estilo calendário (reaproveitada por público, docente e admin) */
function gradeSemanal(espacoId, opts={}){
  const { publico=false, importMode=false, editavel=false } = opts;
  const e = espacos.find(x=>x.id===espacoId);
  const START=13*60, END=22*60+50, PX=1.0, OFF=10; // eixo 13:00 → 22:50 (turno tarde/noite)
  const totalPx=(END-START)*PX + OFF + 6;
  const hours=[]; for(let h=13; h<=22; h++) hours.push(h);
  const y = (m)=> (m-START)*PX + OFF;              // minuto → posição vertical

  // cabeçalho dos dias
  const dayHead = DIAS.map(d=>`
    <div class="cal-headday text-center border-l border-if-slate-100">
      <div class="wd">${d}</div>
      <div class="dn">${DIA_NUM[d]}</div>
    </div>`).join('');

  // linhas de hora (fundo) reutilizadas em cada coluna
  const hourLines = hours.map(h=>`<div class="cal-line" style="top:${y(h*60)}px"></div>`).join('');

  // chave de agrupamento de um período ocupado (mesma aula/reserva)
  const ocupKey = (dia, slot)=>{
    const st = cellStatus(espacoId,dia,slot);
    if(st==='aula'){ const a=ocupacaoAulas[`${espacoId}|${dia}|${slot}`]; return 'aula|'+a.disc+'|'+a.turma+'|'+a.prof; }
    if(st==='aprovada'||st==='pendente'){ const r=findReserva(espacoId,dia,slot); return 'res|'+(r?r.id:st); }
    return null;
  };

  // bloco livre (um período), clicável conforme o contexto
  const freeBlock = (dia, slot)=>{
    if(publico) return '';
    let onClick='', lbl='';
    if(importMode){
      if(!editavel) return '';                     // pré-visualização: não interage
      onClick=`onclick="openAulaEditor('add','${espacoId}','${dia}','${slot}','${slot}')"`; lbl='Adicionar aula';
    } else if(state.role==='docente'){
      onClick=`onclick="abrirNovaReserva('${espacoId}','${dia}','${slot}')"`; lbl='Reservar';
    } else return '';
    const pos=`top:${y(toMin(slot))}px;height:${(toMin(SLOT_TIMES[slot])-toMin(slot))*PX}px;left:4px;right:4px`;
    return `<div ${onClick} class="cal-free group absolute" style="${pos}" title="${slot}–${SLOT_TIMES[slot]} livre">
      <span class="cal-free-label">${icon('plus','w-3.5 h-3.5')} ${lbl}</span></div>`;
  };

  // bloco ocupado (agrupando os períodos contíguos de startSlot..endSlot)
  const eventBlock = (dia, startSlot, endSlot, st)=>{
    const top=y(toMin(startSlot));
    const h=(toMin(SLOT_TIMES[endSlot])-toMin(startSlot))*PX - 2;
    const timeLbl=`${startSlot}–${SLOT_TIMES[endSlot]}`;
    const pos=`top:${top}px;height:${h}px;left:4px;right:4px`;
    let cls, title, sub, tip;
    const r=findReserva(espacoId,dia,startSlot);
    if(st==='aula'){
      const a=ocupacaoAulas[`${espacoId}|${dia}|${startSlot}`];
      cls='cal-ev-aula'; title=a.disc; sub=`${a.prof} · ${a.turma}`;
      tip=`${timeLbl} · ${a.disc} · Prof. ${a.prof} · ${a.turma}`;
    } else if(st==='aprovada'){
      cls='cal-ev-aprov'; title=publico?'Reservado':(r?r.titulo:'Reservado'); sub=publico?'':'Reserva aprovada';
      tip=publico?`${timeLbl} · Reservado`:`${timeLbl} · ${title}${r?(' · '+userNome(r.docente)):''}`;
    } else {
      cls='cal-ev-pend'; title=publico?'Ocupado':(r?r.titulo:'Pendente'); sub=publico?'':'Aguardando aprovação';
      tip=publico?`${timeLbl} · Ocupado`:`${timeLbl} · ${title}${r?(' · '+userNome(r.docente)):''}`;
    }
    const editando = importMode && editavel && st==='aula';
    const click = editando
      ? `onclick="openAulaEditor('edit','${espacoId}','${dia}','${startSlot}','${endSlot}')" style="${pos};cursor:pointer"`
      : `onclick="openEventoDetalhe('${espacoId}','${dia}','${startSlot}','${endSlot}','${st}')" style="${pos};cursor:pointer"`;
    const mostraHora = startSlot!==endSlot; // só em blocos que abrangem vários períodos
    return `<div ${click} class="cal-ev ${cls} absolute ${editando?'cal-ev-edit':''}" title="${editando?'Clique para editar · ':''}${tip}">
      ${editando?`<span class="cal-ev-pencil">${icon('edit','w-3 h-3')}</span>`:''}
      ${mostraHora?`<div class="cal-ev-time">${timeLbl}</div>`:''}
      <div class="cal-ev-title">${title}</div>
      ${sub?`<div class="cal-ev-sub">${sub}</div>`:''}
    </div>`;
  };

  // coluna de um dia: varre os períodos, mesclando contíguos iguais
  const dayCol = (dia, idx)=>{
    const parts=[];
    let i=0;
    while(i<SLOTS.length){
      const slot=SLOTS[i];
      const st=cellStatus(espacoId,dia,slot);
      if(st==='livre'){ parts.push(freeBlock(dia,slot)); i++; continue; }
      const k=ocupKey(dia,slot);
      let j=i;
      // mescla períodos seguidos do mesmo evento, inclusive através de intervalos curtos (≤25 min)
      while(j+1<SLOTS.length){
        const gap = toMin(SLOTS[j+1]) - toMin(SLOT_TIMES[SLOTS[j]]);
        if(gap<=25 && ocupKey(dia,SLOTS[j+1])===k){ j++; } else break;
      }
      parts.push(eventBlock(dia, slot, SLOTS[j], st));
      i=j+1;
    }
    return `<div class="cal-day ${idx%2?'alt':''} relative border-l border-if-slate-100" style="height:${totalPx}px">${hourLines}${parts.join('')}</div>`;
  };

  return card(`
    <div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-if-green-50 text-if-green-700 flex items-center justify-center">${icon('building')}</span>
        <div>
          <div class="font-bold">${e.nome}</div>
          <div class="text-xs text-if-slate-500">${e.bloco} · ${e.tipo} · ${e.cap} lugares</div>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2.5 py-1 rounded-full">${icon('calendar','w-3.5 h-3.5')} ${state.semana}</span>
        ${e.recursos.slice(0,3).map(r=>`<span class="text-[11px] font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2 py-0.5 rounded-full">${r}</span>`).join('')}
      </div>
    </div>
    <div class="overflow-x-auto">
      <div style="min-width:740px">
        <!-- cabeçalho -->
        <div class="cal-headrow grid sticky top-0 z-10 border-b border-if-slate-200" style="grid-template-columns:56px repeat(5,1fr)">
          <div></div>${dayHead}
        </div>
        <!-- corpo -->
        <div class="grid" style="grid-template-columns:56px repeat(5,1fr)">
          <div class="relative" style="height:${totalPx}px">
            ${hours.map(h=>`<div class="cal-hour" style="top:${y(h*60)}px">${String(h).padStart(2,'0')}:00</div>`).join('')}
          </div>
          ${DIAS.map((d,i)=>dayCol(d,i)).join('')}
        </div>
      </div>
    </div>
    ${(!publico && state.role==='docente')?`<div class="px-5 py-3 border-t border-if-slate-100 text-xs text-if-slate-500 flex items-center gap-2">${icon('plus','w-4 h-4 text-if-green')} Passe o mouse sobre um horário <strong>livre</strong> e clique para solicitar uma reserva.</div>`:''}
    ${importMode?`<div class="px-5 py-3 border-t border-if-slate-100 text-xs text-if-slate-500 flex items-center gap-2">${icon('edit','w-4 h-4 text-if-green')} Edição pontual: clique numa aula para liberá-la, ou num horário livre para marcar como aula (RF02).</div>`:''}
  `);
}

/* ============================ DOCENTE ============================ */
function statCard(value, label, ic, color='if-green'){

    <span class="w-12 h-12 rounded-xl bg-${color}-50 text-${color}-700 flex items-center justify-center">${icon(ic,'w-6 h-6')}</span>

}

function docDashboard(){
  const minhas = reservas.filter(r=>r.docente===state.user.id);
  const pend = minhas.filter(r=>r.status==='pendente').length;
  const aprov = minhas.filter(r=>r.status==='aprovada').length;
  return `

    <div class="grid sm:grid-cols-3 gap-4 mb-6">
      ${statCard(minhas.length,'Reservas no total','calendar')}
      ${statCard(aprov,'Aprovadas','check')}
      ${statCard(pend,'Aguardando análise','clock','if-amber')}
    </div>
    ${card(`
      <div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between">
        <h2 class="font-bold">Minhas reservas recentes</h2>
        <button onclick="go('minhas')" class="text-sm font-semibold text-if-green-700 hover:underline">Ver todas</button>
      </div>
      ${reservaTabela(minhas.slice(0,5), true)}
    `)}`;
}

function reservaTabela(list, comAcoesDoc=false){
  if(!list.length) return `<div class="p-10 text-center text-if-slate-400 text-sm">Nenhuma reserva por aqui ainda.</div>`;
  const rows = list.map(r=>`
    <tr class="border-t border-if-slate-100 hover:bg-if-slate-50/60">
      <td class="px-5 py-3"><div class="font-semibold text-sm">${r.titulo}</div><div class="text-xs text-if-slate-500">${espacoNome(r.espaco)}</div></td>
      <td class="px-5 py-3 text-sm text-if-slate-600 whitespace-nowrap">${r.data}<div class="text-xs text-if-slate-400">${r.dia} · ${r.slot}</div></td>
      <td class="px-5 py-3">${badge(r.status)}${r.motivo?`<div class="text-[11px] text-if-red-700 mt-1 max-w-[200px]">${r.motivo}</div>`:''}</td>
      <td class="px-5 py-3 text-right">
        ${comAcoesDoc && (r.status==='pendente'||r.status==='aprovada')?`<button onclick="cancelarReserva('${r.id}')" class="inline-flex items-center gap-1.5 text-sm font-medium text-if-red hover:bg-if-red-50 px-3 py-1.5 rounded-lg">${icon('x','w-4 h-4')} Cancelar</button>`:'<span class="text-xs text-if-slate-400">—</span>'}
      </td>
    </tr>`).join('');
  return `<div class="overflow-x-auto"><table class="w-full min-w-[560px]">
    <thead><tr class="text-left text-xs font-bold uppercase tracking-wide text-if-slate-400">
      <th class="px-5 py-3">Reserva</th><th class="px-5 py-3">Quando</th><th class="px-5 py-3">Status</th><th class="px-5 py-3 text-right">Ações</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function docDisponibilidade(){
  return `
    ${pageHead('Disponibilidade dos espaços','Selecione um espaço e clique em um horário livre para solicitar.')}
    ${espacoTabs()}
    ${gradeSemanal(state.espacoSel)}
    <div class="mt-5 grid sm:grid-cols-3 gap-4">${legenda()}</div>`;
}

function docMinhas(){
  const minhas = reservas.filter(r=>r.docente===state.user.id);
  return `
    ${pageHead('Minhas reservas','Histórico completo das suas solicitações.', `<button onclick="go('disponibilidade')" class="inline-flex items-center gap-2 bg-if-green hover:bg-if-green-600 text-white text-sm font-semibold px-4 py-2.5 rounded-lg">${icon('plus','w-4 h-4')} Nova solicitação</button>`)}
    ${card(reservaTabela(minhas, true))}`;
}

/* ---------- Nova reserva (RF06) com verificação de conflito ---------- */
function abrirNovaReserva(espacoId, dia, slot){
  state.form = { espacoId: espacoId||state.espacoSel, dia: dia||'Seg', slot: slot||SLOTS[0] };
  renderNovaReservaModal();
}
window.abrirNovaReserva = abrirNovaReserva;

function renderNovaReservaModal(){
  const f = state.form;
  const dataMap = {Seg:'08/06/2026',Ter:'09/06/2026',Qua:'10/06/2026',Qui:'11/06/2026',Sex:'12/06/2026'};
  const st = cellStatus(f.espacoId, f.dia, f.slot);
  const conflito = st!=='livre';
  const confMsg = {
    aula:'Este horário está ocupado por uma aula regular da grade institucional.',
    aprovada:'Já existe uma reserva aprovada para este horário.',
    pendente:'Já existe uma solicitação pendente para este horário.',
  }[st];
  openModal(`
    <div class="px-6 py-4 border-b border-if-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-lg flex items-center gap-2">${icon('plus','w-5 h-5 text-if-green')} Nova solicitação de reserva</h3>
      <button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink">${icon('x')}</button>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Espaço</label>
        ${ddField(f.espacoId, espacos.map(e=>[e.id,e.nome]), "updForm('espacoId',$V)", {cls:'w-full'})}
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Dia</label>
          ${ddField(f.dia, DIAS.map(d=>[d,d]), "updForm('dia',$V)", {cls:'w-full'})}
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Horário</label>
          ${ddField(f.slot, SLOTS.map(s=>[s,`${s} (${turno(s)})`]), "updForm('slot',$V)", {cls:'w-full'})}
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Finalidade / título</label>
        <input id="reserva-titulo" placeholder="Ex.: Monitoria de Algoritmos" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none" />
      </div>

      <!-- verificação automática de conflito (heurística de prevenção de erros) -->
      <div class="rounded-xl p-3.5 text-sm flex items-start gap-2.5 ${conflito?'bg-if-red-50 text-if-red-700 ring-1 ring-red-200':'bg-if-green-50 text-if-green-700 ring-1 ring-if-green-100'}">
        <span class="mt-0.5">${icon(conflito?'x':'check','w-4 h-4')}</span>
        <div><strong>${conflito?'Conflito de horário':'Horário disponível'}.</strong> ${conflito?confMsg:'Envie a solicitação e o administrador receberá um e-mail.'}</div>
      </div>
      <div class="text-xs text-if-slate-500">Data correspondente: <strong>${dataMap[f.dia]}</strong></div>
    </div>
    <div class="px-6 py-4 border-t border-if-slate-100 flex items-center justify-end gap-2 bg-if-slate-50">
      <button onclick="closeModal()" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-if-slate-600 hover:bg-if-slate-100">Cancelar</button>
      <button ${conflito?'disabled':''} onclick="enviarReserva()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold text-white ${conflito?'bg-if-slate-300 cursor-not-allowed':'bg-if-green hover:bg-if-green-600'}">${icon('check','w-4 h-4')} Enviar solicitação</button>
    </div>
  `);
}
window.updForm = (k,v)=>{ state.form[k]=v; const t=document.getElementById('reserva-titulo'); if(t) state.form._titulo=t.value; renderNovaReservaModal(); setTimeout(()=>{const x=document.getElementById('reserva-titulo'); if(x&&state.form._titulo) x.value=state.form._titulo;},0); };

function enviarReserva(){
  const f=state.form;
  const titulo=(document.getElementById('reserva-titulo')?.value||state.form._titulo||'').trim()||'Reserva sem título';
  const dataMap = {Seg:'08/06/2026',Ter:'09/06/2026',Qua:'10/06/2026',Qui:'11/06/2026',Sex:'12/06/2026'};
  reservas.unshift({ id:uid('r'), espaco:f.espacoId, dia:f.dia, slot:f.slot, data:dataMap[f.dia], docente:state.user.id, titulo, status:'pendente', criada:'06/06 agora' });
  pushNotif('admin','inbox','Nova solicitação de reserva', `${titulo} — ${espacoNome(f.espacoId)} · ${f.dia} ${f.slot} · ${state.user.nome}`);
  pushNotif('docente','inbox','Solicitação recebida', `${titulo} — ${espacoNome(f.espacoId)} · ${f.dia} ${f.slot} entrou como pendente.`, state.user.id);
  closeModal();
  toast('Solicitação enviada','Sua reserva entrou como <strong>Pendente</strong> e aguarda análise.','ok');
  setTimeout(()=>toast('E-mail enviado ao administrador','Notificamos a equipe sobre o pedido “'+titulo+'”. (RF09)','mail'),700);
  go('minhas');
}
window.enviarReserva = enviarReserva;

function cancelarReserva(id){
  const r=reservas.find(x=>x.id===id); if(!r) return;
  openModal(`
    <div class="p-6">
      <div class="w-12 h-12 rounded-xl bg-if-red-50 text-if-red flex items-center justify-center mb-4">${icon('trash')}</div>
      <h3 class="font-bold text-lg">Cancelar reserva?</h3>
      <p class="text-if-slate-600 text-sm mt-1">“${r.titulo}” em <strong>${espacoNome(r.espaco)}</strong> · ${r.dia} ${r.slot}. Esta ação libera o horário.</p>
    </div>
    <div class="px-6 py-4 border-t border-if-slate-100 flex justify-end gap-2 bg-if-slate-50">
      <button onclick="closeModal()" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-if-slate-600 hover:bg-if-slate-100">Voltar</button>
      <button onclick="confirmarCancel('${id}')" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-if-red hover:bg-if-red-600">${icon('check','w-4 h-4')} Confirmar cancelamento</button>
    </div>`,'max-w-md');
}
window.cancelarReserva = cancelarReserva;
function confirmarCancel(id){
  const r=reservas.find(x=>x.id===id); if(r) r.status='cancelada';
  closeModal(); toast('Reserva cancelada','O horário foi liberado na agenda. (RF08)','ok'); render();
}
window.confirmarCancel = confirmarCancel;

/* ============================ ADMIN ============================ */
function adminDashboard(){
  const pend = reservas.filter(r=>r.status==='pendente').length;
  const total = reservas.filter(r=>r.status!=='cancelada').length;
  const totalSlots = espacos.length*DIAS.length*SLOTS.length;
  let ocup=0; espacos.forEach(e=>DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') ocup++; })));
  const taxa = Math.round(ocup/totalSlots*100);
  return `
    ${pageHead('Painel administrativo','Visão geral da utilização dos espaços do campus.', `<button onclick="go('importar')" class="inline-flex items-center gap-2 bg-white ring-1 ring-if-slate-300 text-if-ink text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-if-slate-50">${icon('upload','w-4 h-4')} Importar horários</button>`)}
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard(pend,'Solicitações pendentes','inbox','if-amber')}
      ${statCard(espacos.length,'Espaços cadastrados','building')}
      ${statCard(taxa+'%','Taxa de ocupação','chart')}
      ${statCard(total,'Reservas ativas','calendar')}
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2">
        ${card(`
          <div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between">
            <h2 class="font-bold">Solicitações aguardando análise</h2>
            <button onclick="go('solicitacoes')" class="text-sm font-semibold text-if-green-700 hover:underline">Abrir fila</button>
          </div>
          ${filaSolicitacoes(reservas.filter(r=>r.status==='pendente').slice(0,4))}
        `)}
      </div>
      <div>
        ${card(`
          <div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Ocupação por espaço</h2></div>
          <div class="p-5 space-y-3.5">${ocupacaoPorEspaco()}</div>
        `)}
      </div>
    </div>`;
}

function ocupacaoPorEspaco(){
  return espacos.map(e=>{
    let oc=0; DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') oc++; }));
    const pct=Math.round(oc/(DIAS.length*SLOTS.length)*100);
    return `<div>
      <div class="flex justify-between text-sm mb-1"><span class="font-medium text-if-slate-600 truncate pr-2">${e.nome}</span><span class="font-bold text-if-ink">${pct}%</span></div>
      <div class="h-2.5 rounded-full bg-if-slate-100 overflow-hidden"><div class="h-full bg-if-green rounded-full" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

/* ---------- Fila de aprovação (RF07/RF09/RF10) ---------- */
function adminSolicitacoes(){
  const pend = reservas.filter(r=>r.status==='pendente');
  const recent = reservas.filter(r=>r.status==='aprovada'||r.status==='rejeitada').slice(0,6);
  return `
    ${pageHead('Solicitações de reserva', pend.length?`${pend.length} pedido(s) aguardando sua análise.`:'Nenhum pedido pendente no momento.')}
    ${card(`<div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold flex items-center gap-2">${icon('inbox','w-5 h-5 text-if-amber')} Pendentes</h2></div>${filaSolicitacoes(pend)}`)}
    <div class="mt-6">
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Decisões recentes</h2></div>
      <div class="overflow-x-auto"><table class="w-full min-w-[600px]">
        <thead><tr class="text-left text-xs font-bold uppercase tracking-wide text-if-slate-400">
          <th class="px-5 py-3">Reserva</th><th class="px-5 py-3">Docente</th><th class="px-5 py-3">Quando</th><th class="px-5 py-3">Status</th>
        </tr></thead><tbody>
        ${recent.map(r=>`<tr class="border-t border-if-slate-100">
          <td class="px-5 py-3"><div class="font-semibold text-sm">${r.titulo}</div><div class="text-xs text-if-slate-500">${espacoNome(r.espaco)}</div></td>
          <td class="px-5 py-3 text-sm text-if-slate-600">${userNome(r.docente)}</td>
          <td class="px-5 py-3 text-sm text-if-slate-600 whitespace-nowrap">${r.data} · ${r.slot}</td>
          <td class="px-5 py-3">${badge(r.status)}</td>
        </tr>`).join('')||`<tr><td colspan="4" class="p-8 text-center text-if-slate-400 text-sm">Sem decisões ainda.</td></tr>`}
        </tbody></table></div>`)}
    </div>`;
}

function filaSolicitacoes(list){
  if(!list.length) return `<div class="p-10 text-center text-if-slate-400 text-sm flex flex-col items-center gap-2">${icon('check','w-8 h-8 text-if-green-200')} Nenhuma solicitação pendente no momento.</div>`;
  return `<div class="divide-y divide-if-slate-100">${list.map(r=>`
    <div class="px-5 py-4 flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-semibold">${r.titulo}</span> ${badge('pendente')}
        </div>
        <div class="text-sm text-if-slate-500 mt-1 flex flex-wrap gap-x-4 gap-y-0.5">
          <span>${icon('building','w-3.5 h-3.5 inline -mt-0.5')} ${espacoNome(r.espaco)}</span>
          <span>${icon('calendar','w-3.5 h-3.5 inline -mt-0.5')} ${r.data} · ${r.dia} ${r.slot}</span>
          <span>${icon('users','w-3.5 h-3.5 inline -mt-0.5')} ${userNome(r.docente)}</span>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-none">
        <button onclick="rejeitar('${r.id}')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-if-red ring-1 ring-red-200 hover:bg-if-red-50 px-3.5 py-2 rounded-lg">${icon('x','w-4 h-4')} Rejeitar</button>
        <button onclick="aprovar('${r.id}')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-white bg-if-green hover:bg-if-green-600 px-3.5 py-2 rounded-lg">${icon('check','w-4 h-4')} Aprovar</button>
      </div>
    </div>`).join('')}</div>`;
}

function aprovar(id){
  const r=reservas.find(x=>x.id===id); if(!r) return; r.status='aprovada';
  pushNotif('docente','check','Reserva aprovada', `${r.titulo} — ${espacoNome(r.espaco)} · ${r.dia} ${r.slot}`, r.docente);
  toast('Reserva aprovada','“'+r.titulo+'” confirmada para '+espacoNome(r.espaco)+'. (RF07)','ok');
  setTimeout(()=>toast('E-mail enviado ao docente',userEmail(r.docente)+' foi notificado da aprovação. (RF10)','mail'),650);
  render();
}
window.aprovar = aprovar;

function rejeitar(id){
  const r=reservas.find(x=>x.id===id); if(!r) return;
  openModal(`
    <div class="px-6 py-4 border-b border-if-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-lg flex items-center gap-2">${icon('x','w-5 h-5 text-if-red')} Rejeitar solicitação</h3>
      <button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink">${icon('x')}</button>
    </div>
    <div class="p-6 space-y-3">
      <p class="text-sm text-if-slate-600">“<strong>${r.titulo}</strong>” · ${espacoNome(r.espaco)} · ${r.dia} ${r.slot}</p>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Motivo (enviado ao docente)</label>
        <textarea id="motivo-rej" rows="3" placeholder="Ex.: Espaço reservado para manutenção." class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-red outline-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-if-slate-100 flex justify-end gap-2 bg-if-slate-50">
      <button onclick="closeModal()" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-if-slate-600 hover:bg-if-slate-100">Cancelar</button>
      <button onclick="confirmarRej('${id}')" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-if-red hover:bg-if-red-600">${icon('check','w-4 h-4')} Confirmar rejeição</button>
    </div>`,'max-w-md');
}
window.rejeitar = rejeitar;
function confirmarRej(id){
  const r=reservas.find(x=>x.id===id); if(!r) return;
  r.status='rejeitada'; r.motivo=(document.getElementById('motivo-rej')?.value||'').trim()||'Não informado.';
  pushNotif('docente','x','Reserva rejeitada', `${r.titulo} — ${espacoNome(r.espaco)} · ${r.dia} ${r.slot}. Motivo: ${r.motivo}`, r.docente);
  closeModal();
  toast('Solicitação rejeitada','“'+r.titulo+'” foi recusada. (RF07)','warn');
  setTimeout(()=>toast('E-mail enviado ao docente',userEmail(r.docente)+' recebeu o motivo da recusa. (RF10)','mail'),650);
  render();
}
window.confirmarRej = confirmarRej;

  return `
    ${pageHead('Espaços físicos','Cadastro e manutenção dos ambientes do campus.', `<button onclick="formEspaco()" class="inline-flex items-center gap-2 bg-if-green hover:bg-if-green-600 text-white text-sm font-semibold px-4 py-2.5 rounded-lg">${icon('plus','w-4 h-4')} Novo espaço</button>`)}
    ${card(`<div class="overflow-x-auto"><table class="w-full min-w-[680px]">
      <thead><tr class="text-left text-xs font-bold uppercase tracking-wide text-if-slate-400">
        <th class="px-5 py-3">Espaço</th><th class="px-5 py-3">Tipo</th><th class="px-5 py-3">Bloco</th><th class="px-5 py-3">Cap.</th><th class="px-5 py-3">Recursos</th><th class="px-5 py-3 text-right">Ações</th>

        <td class="px-5 py-3 text-sm text-if-slate-600">${e.bloco}</td>
        <td class="px-5 py-3 text-sm text-if-slate-600">${e.cap}</td>

        <td class="px-5 py-3 text-right whitespace-nowrap">

        </td>
      </tr>`).join('')}
      </tbody></table></div>`)}`;
}
function formEspaco(id){
  const e = id?espacos.find(x=>x.id===id):{nome:'',tipo:'Laboratório',bloco:'',cap:'',recursos:[]};
  openModal(`
    <div class="px-6 py-4 border-b border-if-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-lg">${id?'Editar espaço':'Novo espaço'}</h3>
      <button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink">${icon('x')}</button>
    </div>
    <div class="p-6 space-y-4">
      <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Nome</label>
        <input id="esp-nome" value="${e.nome}" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none" /></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Tipo</label>

      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Capacidade</label>
          <input id="esp-cap" type="number" value="${e.cap}" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none" /></div>
        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Recursos (vírgula)</label>
          <input id="esp-rec" value="${e.recursos.join(', ')}" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none" /></div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-if-slate-100 flex justify-end gap-2 bg-if-slate-50">

      <button onclick="salvarEspaco('${id||''}')" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-if-green hover:bg-if-green-600">${icon('check','w-4 h-4')} Salvar</button>
    </div>`);
}
window.formEspaco = formEspaco;
function salvarEspaco(id){
  const get=x=>document.getElementById(x).value;
  const obj={ nome:get('esp-nome')||'Espaço sem nome', tipo:get('esp-tipo'), bloco:get('esp-bloco'), cap:+get('esp-cap')||0, recursos:get('esp-rec').split(',').map(s=>s.trim()).filter(Boolean), ativo:true };
  if(id){ Object.assign(espacos.find(e=>e.id===id),obj); toast('Espaço atualizado',obj.nome+' foi salvo. (RF03)','ok'); }
  else { obj.id=uid('e'); espacos.push(obj); toast('Espaço cadastrado',obj.nome+' adicionado ao campus. (RF03)','ok'); }
  closeModal(); render();
}
window.salvarEspaco = salvarEspaco;
function delEspaco(id){
  const e=espacos.find(x=>x.id===id);
  openModal(`<div class="p-6"><div class="w-12 h-12 rounded-xl bg-if-red-50 text-if-red flex items-center justify-center mb-4">${icon('trash')}</div>
    <h3 class="font-bold text-lg">Remover “${e.nome}”?</h3><p class="text-if-slate-600 text-sm mt-1">O espaço deixará de aparecer para reservas.</p></div>
    <div class="px-6 py-4 border-t border-if-slate-100 flex justify-end gap-2 bg-if-slate-50">
    <button onclick="closeModal()" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-if-slate-600 hover:bg-if-slate-100">Voltar</button>
    <button onclick="confDelEspaco('${id}')" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-if-red hover:bg-if-red-600">Remover</button></div>`,'max-w-md');

function gradeStats(){

}

/* ---------- Editor de aula (ajuste manual) — RF02 ---------- */
function openAulaEditor(mode, espacoId, dia, startSlot, endSlot){

  state.aulaForm = { mode, espacoId, dia, startSlot, endSlot, origDia:dia, origStart:startSlot, origEnd:endSlot, disc:a.disc||'', prof:a.prof||'', turma:a.turma||(turmas[0]?turmas[0].nome:'') };
  renderAulaEditor();
}
window.openAulaEditor = openAulaEditor;
function aulaSet(k,v){ if(state.aulaForm){ state.aulaForm[k]=v; if(k==='startSlot'||k==='endSlot') renderAulaEditor(); } }
window.aulaSet = aulaSet;

function renderAulaEditor(){
  const f = state.aulaForm; if(!f) return;
  const e = espacos.find(x=>x.id===f.espacoId)||{};

    </div>
    <div class="p-6 space-y-4">
      <div class="rounded-lg bg-if-slate-50 ring-1 ring-if-slate-200 px-3 py-2 text-xs text-if-slate-500 flex items-center gap-2">${icon('building','w-4 h-4 text-if-slate-400')} ${e.nome} · ${e.bloco}</div>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Dia</label>

        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Início</label>

        <div><label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Fim</label>

}

function aulaSlotsRange(startSlot, endSlot){ const a=SLOTS.indexOf(startSlot), b=SLOTS.indexOf(endSlot); return SLOTS.slice(a, b+1); }
function salvarAula(){
  const f=state.aulaForm; if(!f) return;
  const disc=(document.getElementById('aula-disc')?.value||f.disc).trim();
  const prof=(document.getElementById('aula-prof')?.value||f.prof).trim()||'—';
  if(!disc) return;
  // ao editar, remove os períodos antigos do bloco original (dia/horário podem ter mudado)
  if(f.mode==='edit'){ aulaSlotsRange(f.origStart, f.origEnd).forEach(s=>{ delete ocupacaoAulas[`${f.espacoId}|${f.origDia}|${s}`]; }); }
  aulaSlotsRange(f.startSlot, f.endSlot).forEach(s=>{ ocupacaoAulas[`${f.espacoId}|${f.dia}|${s}`]={disc, prof, turma:f.turma}; });
  closeModal();
  toast(f.mode==='edit'?'Aula atualizada':'Aula adicionada', `${disc} · ${f.dia} ${f.startSlot}–${SLOT_TIMES[f.endSlot]} (RF02)`,'ok');
  render();
}
window.salvarAula = salvarAula;
function removerAula(){
  const f=state.aulaForm; if(!f) return;
  aulaSlotsRange(f.startSlot, f.endSlot).forEach(s=>{ delete ocupacaoAulas[`${f.espacoId}|${f.dia}|${s}`]; });
  closeModal();
  toast('Aula removida','Horário liberado na grade. (RF02)','warn');
  render();
}
window.removerAula = removerAula;

/* lista unificada de ocupações (aulas + reservas ativas) */
function ocupacoesList(){
  const out=[];
  Object.entries(ocupacaoAulas).forEach(([k,v])=>{ const [esp,dia,slot]=k.split('|'); out.push({tipo:'aula',esp,dia,slot,titulo:v.disc,prof:v.prof,turma:v.turma}); });
  reservas.filter(r=>r.status==='aprovada'||r.status==='pendente').forEach(r=>out.push({tipo:'reserva',esp:r.espaco,dia:r.dia,slot:r.slot,titulo:r.titulo,docente:userNome(r.docente),status:r.status}));
  return out;
}
const PALETA = ['#2D9E3F','#268A37','#C9821C','#CF171F','#4B5358','#6B7378','#A9D7AE'];

/* modal de detalhes (drilldown) com paginação */
let _detalhe = null;
function openDetalhe(titulo, sub, itens){ _detalhe = { titulo, sub, itens, page:1, perPage:6 }; renderDetalhe(); }
function detalhePage(p){ if(!_detalhe) return; _detalhe.page = p; renderDetalhe(); }
window.openDetalhe = openDetalhe; window.detalhePage = detalhePage;

function renderDetalhe(){
  const { titulo, sub, itens, perPage } = _detalhe;
  const total = itens.length;
  const pages = Math.max(1, Math.ceil(total/perPage));
  const page = Math.min(Math.max(1,_detalhe.page), pages);
  _detalhe.page = page;
  const slice = itens.slice((page-1)*perPage, page*perPage);

  const rows = total ? slice.map(o=>{
    const isA = o.tipo==='aula';
    const cl = isA?'bg-if-slate-100 text-if-slate-600':(o.status==='aprovada'?'bg-if-green-50 text-if-green-700':'bg-if-amber-50 text-if-amber');
    const right = isA ? `<span class="text-[11px] font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2 py-0.5 rounded-full">${o.turma}</span>` : badge(o.status);
    return `<div class="flex items-center gap-3 px-5 py-3 border-b border-if-slate-100 last:border-0">
      <span class="flex-none w-9 h-9 rounded-lg flex items-center justify-center ${cl}">${icon(isA?'building':'calendar','w-4 h-4')}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold truncate">${o.titulo}</div>
        <div class="text-xs text-if-slate-500 truncate">${espacoNome(o.esp)} · ${o.dia} ${o.slot}–${SLOT_TIMES[o.slot]} · ${isA?o.prof:o.docente}</div>
      </div>
      <div class="flex-none">${right}</div>
    </div>`;
  }).join('') : `<div class="px-5 py-12 text-center text-sm text-if-slate-400 flex flex-col items-center gap-2">${icon('search','w-8 h-8 text-if-slate-200')} Nenhum registro para este filtro.</div>`;

  const ini = total ? (page-1)*perPage+1 : 0;
  const fim = Math.min(page*perPage, total);
  const footer = pages>1 ? `
    <div class="px-5 py-3 border-t border-if-slate-100 bg-if-slate-50 flex items-center justify-between">
      <span class="text-xs font-semibold text-if-slate-500">${ini}–${fim} de ${total}</span>
      <div class="flex items-center gap-1">
        <button ${page<=1?'disabled':''} onclick="detalhePage(${page-1})" class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-lg ${page<=1?'text-if-slate-300 cursor-not-allowed':'text-if-slate-600 hover:bg-if-slate-100'}">${icon('chevron','w-4 h-4 rotate-90')} Anterior</button>
        <span class="text-xs font-semibold text-if-slate-500 px-2">${page}/${pages}</span>
        <button ${page>=pages?'disabled':''} onclick="detalhePage(${page+1})" class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-lg ${page>=pages?'text-if-slate-300 cursor-not-allowed':'text-if-slate-600 hover:bg-if-slate-100'}">Próxima ${icon('chevron','w-4 h-4 -rotate-90')}</button>
      </div>
    </div>` : `<div class="px-6 py-3 border-t border-if-slate-100 bg-if-slate-50 text-xs font-semibold text-if-slate-500">${total} registro(s)</div>`;

  openModal(`
    <div class="px-6 py-4 border-b border-if-slate-100 flex items-center justify-between">
      <div><h3 class="font-bold text-lg">${titulo}</h3>${sub?`<p class="text-xs text-if-slate-500 mt-0.5">${sub}</p>`:''}</div>
      <button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink">${icon('x')}</button>
    </div>
    <div class="min-h-[280px]">${rows}</div>

  `,'max-w-lg');

/* ---- Filtros dos relatórios (funcionais) ---- */
function relF(){ return state.relFiltro || (state.relFiltro={espaco:'all',tipo:'all',dia:'all'}); }
function ocFiltrada(){
  const f=relF();
  return ocupacoesList().filter(o=>
    (f.espaco==='all'||o.esp===f.espaco) &&
    (f.tipo==='all'||o.tipo===f.tipo) &&
    (f.dia==='all'||o.dia===f.dia));
}
function reservasFiltradas(){
  const f=relF();
  return reservas.filter(r=>
    (f.espaco==='all'||r.espaco===f.espaco) &&
    (f.dia==='all'||r.dia===f.dia) &&
    (f.tipo==='all'||f.tipo==='reserva'));
}
function relFiltroAtivos(){ const f=relF(); return (f.espaco!=='all')+(f.tipo!=='all')+(f.dia!=='all'); }
function setRelFiltro(k,v){ relF()[k]=v; render(); }
function limparRelFiltro(){ state.relFiltro={espaco:'all',tipo:'all',dia:'all'}; render(); }
window.setRelFiltro=setRelFiltro; window.limparRelFiltro=limparRelFiltro;
function relFiltroSubtitulo(){ const f=relF(); const p=[];
  if(f.espaco!=='all') p.push(espacoNome(f.espaco));
  if(f.tipo!=='all') p.push(f.tipo==='aula'?'apenas aulas':'apenas reservas');
  if(f.dia!=='all') p.push(({Seg:'Segunda',Ter:'Terça',Qua:'Quarta',Qui:'Quinta',Sex:'Sexta'})[f.dia]);
  return p.length?('Filtro: '+p.join(' · ')):''; }

/* drilldowns chamados pelos cliques (gráficos, KPIs, tabela) — respeitam os filtros */

function drillStatus(st){ const lbl={aprovada:'Aprovadas',pendente:'Pendentes',rejeitada:'Rejeitadas',cancelada:'Canceladas'}[st];
  const itens=reservasFiltradas().filter(r=>r.status===st).map(r=>({tipo:'reserva',esp:r.espaco,dia:r.dia,slot:r.slot,titulo:r.titulo,docente:userNome(r.docente),status:r.status}));

      ${fsel('tipo','Tipo',[['all','Aulas e reservas'],['aula','Apenas aulas'],['reserva','Apenas reservas']])}
      ${fsel('dia','Dia',[['all','Todos'],...DIAS.map(d=>[d,({Seg:'Segunda',Ter:'Terça',Qua:'Quarta',Qui:'Quinta',Sex:'Sexta'})[d]])])}
      <span class="inline-flex items-center gap-1 text-[11px] font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2 py-1 rounded-full">1º semestre 2026</span>
      ${ativos?`<button onclick="limparRelFiltro()" class="ml-auto inline-flex items-center gap-1.5 text-xs font-semibold text-if-red hover:bg-if-red-50 px-2.5 py-1.5 rounded-lg">${icon('x','w-3.5 h-3.5')} Limpar filtros (${ativos})</button>`:''}
    </div>

    <!-- KPIs clicáveis -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${kpiRel(totalAulas,'Aulas na grade','sheet',"openDetalhe('Aulas na grade', relFiltroSubtitulo()||'Aulas no recorte atual', ocFiltrada().filter(o=>o.tipo==='aula'))")}
      ${kpiRel(totalResv,'Reservas ativas','calendar',"openDetalhe('Reservas ativas', relFiltroSubtitulo()||'Reservas no recorte atual', ocFiltrada().filter(o=>o.tipo==='reserva'))")}
      ${kpiRel(taxa+'%','Taxa de ocupação','chart',"openDetalhe('Ocupação', relFiltroSubtitulo()||'Horários ocupados no recorte', ocFiltrada())")}
      ${kpiRel(top?top.nome.replace('Lab. de ','').replace('Laboratório de ',''):'—','Espaço mais usado','building',"drillEspaco('"+(top?top.id:'')+"')")}
    </div>

    <div class="grid lg:grid-cols-2 gap-6 mb-6">
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between"><h2 class="font-bold">Ocupação por espaço</h2><span class="text-xs text-if-slate-400">clique nas barras</span></div>
        <div class="p-5"><div style="height:260px"><canvas id="chEspaco"></canvas></div></div>`)}
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between"><h2 class="font-bold">Status das reservas</h2><span class="text-xs text-if-slate-400">clique nas fatias</span></div>
        <div class="p-5"><div style="height:260px"><canvas id="chStatus"></canvas></div></div>`)}
    </div>

    <div class="grid lg:grid-cols-2 gap-6 mb-6">
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between"><h2 class="font-bold">Ocupação por turno</h2><span class="text-xs text-if-slate-400">clique nas barras</span></div>
        <div class="p-5"><div style="height:260px"><canvas id="chTurno"></canvas></div></div>`)}
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between"><h2 class="font-bold">Distribuição semanal</h2><span class="text-xs text-if-slate-400">aulas × reservas</span></div>
        <div class="p-5"><div style="height:260px"><canvas id="chSemana"></canvas></div></div>`)}
    </div>

    ${card(`<div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Espaços mais demandados</h2></div>
      <div class="overflow-x-auto"><table class="w-full min-w-[480px]">
        <thead><tr class="text-left text-xs font-bold uppercase tracking-wide text-if-slate-400"><th class="px-5 py-3">#</th><th class="px-5 py-3">Espaço</th><th class="px-5 py-3">Ocupações</th><th class="px-5 py-3">Utilização</th><th class="px-5 py-3"></th></tr></thead>
        <tbody>${porEspaco.map((x,i)=>`
          <tr onclick="drillEspaco('${x.id}')" class="border-t border-if-slate-100 hover:bg-if-slate-50 cursor-pointer">
            <td class="px-5 py-3 font-bold text-if-slate-400">${i+1}</td>
            <td class="px-5 py-3 font-semibold text-sm">${x.nome}</td>
            <td class="px-5 py-3 text-sm text-if-slate-600">${x.val}</td>
            <td class="px-5 py-3 text-sm font-bold text-if-green-700">${Math.min(100,Math.round(x.val/(nDia*SLOTS.length)*100))}%</td>
            <td class="px-5 py-3 text-right text-if-slate-400">${icon('chevron','w-4 h-4 inline -rotate-90')}</td></tr>`).join('')}</tbody>
      </table></div>`)}`;
}

function kpiRel(value, label, ic, onclick){
  return `<button onclick="${onclick}" class="text-left bg-white rounded-2xl ring-1 ring-if-slate-200 shadow-card p-5 flex items-center gap-4 hover:ring-if-green-200 hover:shadow-pop transition">
    <span class="w-12 h-12 rounded-xl bg-if-green-50 text-if-green-700 flex items-center justify-center flex-none">${icon(ic,'w-6 h-6')}</span>
    <div class="min-w-0"><div class="text-xl font-extrabold leading-none truncate">${value}</div><div class="text-sm text-if-slate-500 mt-1">${label}</div></div>
  </button>`;
}

/* instâncias Chart.js (destruídas a cada re-render) */
window._charts = {};
function destroyCharts(){ Object.values(window._charts).forEach(c=>{ try{c.destroy();}catch(e){} }); window._charts={}; }

function initRelatorioCharts(){
  if(!window.Chart) return;
  destroyCharts();
  Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  Chart.defaults.color = '#6B7378';
  const oc = ocFiltrada();

  // 1) Ocupação por espaço (barras)
  const esp = espacos.map(e=>({id:e.id,nome:e.nome,val:oc.filter(o=>o.esp===e.id).length}));
  const cEsp=document.getElementById('chEspaco');
  if(cEsp) window._charts.esp = new Chart(cEsp,{ type:'bar',
    data:{ labels:esp.map(e=>e.nome.replace('Lab. de ','').replace('Laboratório de ','')),
      datasets:[{ data:esp.map(e=>e.val), backgroundColor:'#2D9E3F', borderRadius:6, maxBarThickness:46 }] },
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#ECEEEF'}},x:{grid:{display:false}}},
      onClick:(e,el)=>{ if(el.length) drillEspaco(esp[el[0].index].id); },
      onHover:(e,el)=>{ e.native.target.style.cursor = el.length?'pointer':'default'; } } });

  // 2) Status das reservas (rosca)
  const stKeys=['aprovada','pendente','rejeitada','cancelada'];
  const stLabels=['Aprovadas','Pendentes','Rejeitadas','Canceladas'];
  const stData=stKeys.map(k=>reservasFiltradas().filter(r=>r.status===k).length);
  const cSt=document.getElementById('chStatus');
  if(cSt) window._charts.st = new Chart(cSt,{ type:'doughnut',
    data:{ labels:stLabels, datasets:[{ data:stData, backgroundColor:['#2D9E3F','#C9821C','#CF171F','#CBD0D3'], borderWidth:2, borderColor:'#fff' }] },
    options:{ maintainAspectRatio:false, cutout:'60%', plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:14}}},
      onClick:(e,el)=>{ if(el.length) drillStatus(stKeys[el[0].index]); },
      onHover:(e,el)=>{ e.native.target.style.cursor = el.length?'pointer':'default'; } } });

  // 3) Ocupação por turno (barras)
  const turnosArr=['Tarde','Noite'];
  const tData=turnosArr.map(t=>oc.filter(o=>turno(o.slot)===t).length);
  const cT=document.getElementById('chTurno');
  if(cT) window._charts.t = new Chart(cT,{ type:'bar',
    data:{ labels:turnosArr, datasets:[{ data:tData, backgroundColor:['#268A37','#1E7A2E'], borderRadius:6, maxBarThickness:80 }] },
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#ECEEEF'}},x:{grid:{display:false}}},
      onClick:(e,el)=>{ if(el.length) drillTurno(turnosArr[el[0].index]); },
      onHover:(e,el)=>{ e.native.target.style.cursor = el.length?'pointer':'default'; } } });

  // 4) Distribuição semanal (barras empilhadas: aulas × reservas)
  const aulasDia=DIAS.map(d=>oc.filter(o=>o.dia===d && o.tipo==='aula').length);
  const resvDia=DIAS.map(d=>oc.filter(o=>o.dia===d && o.tipo==='reserva').length);
  const cS=document.getElementById('chSemana');
  if(cS) window._charts.s = new Chart(cS,{ type:'bar',
    data:{ labels:DIAS, datasets:[
      { label:'Aulas', data:aulasDia, backgroundColor:'#CBD0D3', borderRadius:4, stack:'a' },
      { label:'Reservas', data:resvDia, backgroundColor:'#2D9E3F', borderRadius:4, stack:'a' } ] },
    options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:14}}},
      scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{precision:0},grid:{color:'#ECEEEF'}}},
      onClick:(e,el)=>{ if(el.length) drillDia(DIAS[el[0].index]); },
      onHover:(e,el)=>{ e.native.target.style.cursor = el.length?'pointer':'default'; } } });
}

function exportarRel(){ toast('Relatório gerado','Exportação de uso dos espaços pronta para download. (RF12)','ok'); }
