/* ---------- Logo institucional (SVG inline, recriado) ---------- */
function logoMark(size=34){
  const u=21, s=16, r=3;
  const greens=[[1,0],[2,0],[0,1],[1,1],[0,2],[1,2],[2,2],[0,3],[1,3]];
  let rects = greens.map(([c,rw])=>`<rect x="${c*u}" y="${rw*u}" width="${s}" height="${s}" rx="${r}" fill="#2D9E3F"/>`).join('');
  return `<svg width="${size}" height="${size*( (4*u-5)/(3*u-5) )}" viewBox="0 0 ${3*u-5} ${4*u-5}" aria-hidden="true">
    <circle cx="8" cy="8" r="8" fill="#CF171F"/>${rects}</svg>`;
}
function logoFull(scale=1){
  return `<div class="flex items-center gap-3 select-none">
    ${logoMark(34*scale)}
    <div class="leading-tight">
      <div class="font-extrabold tracking-tight text-if-ink" style="font-size:${15*scale}px;letter-spacing:-.01em">INSTITUTO FEDERAL</div>
      <div class="text-if-slate-600" style="font-size:${10.5*scale}px;font-weight:600">Norte de Minas Gerais · Campus Salinas</div>
    </div>
  </div>`;
}

/* ---------- Toasts (simulam e-mails / ações) ---------- */
function toast(title, msg, kind='ok'){
  const colors = { ok:'#2D9E3F', mail:'#268A37', warn:'#C9821C', err:'#CF171F' };
  const ic = { ok:'check', mail:'mail', warn:'bell', err:'x' }[kind];
  const el = document.createElement('div');
  el.className = 'toast-in bg-white rounded-xl shadow-pop ring-1 ring-if-slate-200 p-3.5 flex gap-3 items-start';
  el.innerHTML = `
    <span class="mt-0.5 flex-none w-8 h-8 rounded-lg flex items-center justify-center text-white" style="background:${colors[kind]}">${icon(ic,'w-4 h-4')}</span>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold text-if-ink">${title}</div>
      <div class="text-xs text-if-slate-600 mt-0.5 leading-snug">${msg}</div>
    </div>
    <button class="text-if-slate-400 hover:text-if-ink" onclick="this.parentElement.remove()">${icon('x','w-4 h-4')}</button>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 5200);
}

const NOTIF_META = {
  inbox: ['inbox','bg-if-amber-50 text-if-amber'],
  check: ['check','bg-if-green-50 text-if-green-700'],
  x:     ['x','bg-if-red-50 text-if-red'],

function notifsFor(){
  if(state.role==='admin')   return notificacoes.filter(n=>n.alvo==='admin');
  if(state.role==='docente') return notificacoes.filter(n=>n.alvo==='docente' && (!n.user || n.user===state.user.id));

function unreadCount(){ return notifsFor().filter(n=>!n.read).length; }
function pushNotif(alvo, kind, titulo, msg, user){ notificacoes.unshift({ id:uid('n'), alvo, kind, titulo, msg, time:'agora', read:false, user }); }
function toggleNotif(){ state.notifOpen=!state.notifOpen; render(); }
function lerNotif(id){ const n=notificacoes.find(x=>x.id===id); if(n) n.read=true; render(); }
function lerTodas(){ notifsFor().forEach(n=>n.read=true); render(); }
window.toggleNotif=toggleNotif; window.lerNotif=lerNotif; window.lerTodas=lerTodas;

function notifPanel(){
  const list = notifsFor();
  const uc = list.filter(n=>!n.read).length;

    const [ic,cl]=NOTIF_META[n.kind]||NOTIF_META.inbox;

  return `

}

function findReserva(esp,dia,slot){

}

/* Agenda semanal estilo calendário (reaproveitada por público, docente e admin) */
function gradeSemanal(espacoId, opts={}){
  const { publico=false, importMode=false } = opts;
  const e = espacos.find(x=>x.id===espacoId);
  const START=13*60, END=22*60+50, PX=1.0, OFF=10; // eixo 13:00 → 22:50 (turno tarde/noite)
  const totalPx=(END-START)*PX + OFF + 6;
  const hours=[]; for(let h=13; h<=22; h++) hours.push(h);
  const y = (m)=> (m-START)*PX + OFF;              // minuto → posição vertical

  // cabeçalho dos dias
  const dayHead = DIAS.map(d=>`
    <div class="text-center py-2 border-l border-if-slate-100">
      <div class="text-[11px] font-semibold uppercase tracking-wide text-if-slate-500">${d}</div>
      <div class="text-xl font-bold text-if-ink leading-tight">${DIA_NUM[d]}</div>
    </div>`).join('');

  // linhas de hora (fundo) reutilizadas em cada coluna
  const hourLines = hours.map(h=>`<div class="cal-line" style="top:${y(h*60)}px"></div>`).join('');

  // coluna de um dia, com seus eventos
  const dayCol = (dia)=>{
    const events = SLOTS.map(slot=>{
      const top=y(toMin(slot));
      const h=(toMin(SLOT_TIMES[slot])-toMin(slot))*PX;
      const st=cellStatus(espacoId,dia,slot);
      const timeLbl=`${slot}–${SLOT_TIMES[slot]}`;
      const pos=`top:${top}px;height:${h}px;left:4px;right:4px`;

      if(st==='livre'){
        if(publico) return '';
        const onClick = importMode
          ? `onclick="toggleCelula('${espacoId}','${dia}','${slot}')"`
          : (state.role==='docente' ? `onclick="abrirNovaReserva('${espacoId}','${dia}','${slot}')"` : '');
        if(!onClick) return '';
        const lbl = importMode ? 'Marcar aula' : 'Reservar';
        return `<div ${onClick} class="cal-free group absolute" style="${pos}" title="${timeLbl} livre">
          <span class="cal-free-label">${icon('plus','w-3.5 h-3.5')} ${lbl}</span></div>`;
      }

      let cls, title, sub, tip;
      const r=findReserva(espacoId,dia,slot);
      if(st==='aula'){
        const a=ocupacaoAulas[`${espacoId}|${dia}|${slot}`];
        cls='cal-ev-aula'; title=a.disc; sub=`${a.prof} · ${a.turma}`;
        tip=`${timeLbl} · ${a.disc} · Prof. ${a.prof} · ${a.turma}`;
      } else if(st==='aprovada'){
        cls='cal-ev-aprov'; title=publico?'Reservado':(r?r.titulo:'Reservado'); sub=publico?'':'Reserva aprovada';
        tip=publico?`${timeLbl} · Reservado`:`${timeLbl} · ${title}${r?(' · '+userNome(r.docente)):''}`;
      } else {
        cls='cal-ev-pend'; title=publico?'Ocupado':(r?r.titulo:'Pendente'); sub=publico?'':'Aguardando aprovação';
        tip=publico?`${timeLbl} · Ocupado`:`${timeLbl} · ${title}${r?(' · '+userNome(r.docente)):''}`;
      }
      const clickImport=(importMode && st==='aula')?`onclick="toggleCelula('${espacoId}','${dia}','${slot}')" style="${pos};cursor:pointer"`:`style="${pos}"`;
      return `<div ${clickImport} class="cal-ev ${cls} absolute" title="${tip}">
        <div class="cal-ev-title">${title}</div>
        ${sub?`<div class="cal-ev-sub">${sub}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="cal-day relative border-l border-if-slate-100" style="height:${totalPx}px">${hourLines}${events}</div>`;
  };

  return card(`
    <div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-if-green-50 text-if-green-700 flex items-center justify-center">${icon('building')}</span>
        <div>
          <div class="font-bold">${e.nome}</div>
          <div class="text-xs text-if-slate-500">${e.bloco} · ${e.tipo} · ${e.cap} lugares</div>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2.5 py-1 rounded-full">${icon('calendar','w-3.5 h-3.5')} ${state.semana}</span>
        ${e.recursos.slice(0,3).map(r=>`<span class="text-[11px] font-medium text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-2 py-0.5 rounded-full">${r}</span>`).join('')}
      </div>
    </div>
    <div class="overflow-x-auto">
      <div style="min-width:740px">
        <!-- cabeçalho -->
        <div class="grid sticky top-0 bg-white z-10 border-b border-if-slate-100" style="grid-template-columns:56px repeat(5,1fr)">
          <div></div>${dayHead}
        </div>
        <!-- corpo -->
        <div class="grid" style="grid-template-columns:56px repeat(5,1fr)">
          <div class="relative" style="height:${totalPx}px">
            ${hours.map(h=>`<div class="cal-hour" style="top:${y(h*60)}px">${String(h).padStart(2,'0')}:00</div>`).join('')}
          </div>
          ${DIAS.map(dayCol).join('')}
        </div>
      </div>
    </div>
    ${(!publico && state.role==='docente')?`<div class="px-5 py-3 border-t border-if-slate-100 text-xs text-if-slate-500 flex items-center gap-2">${icon('plus','w-4 h-4 text-if-green')} Passe o mouse sobre um horário <strong>livre</strong> e clique para solicitar uma reserva.</div>`:''}
    ${importMode?`<div class="px-5 py-3 border-t border-if-slate-100 text-xs text-if-slate-500 flex items-center gap-2">${icon('edit','w-4 h-4 text-if-green')} Edição pontual: clique numa aula para liberá-la, ou num horário livre para marcar como aula (RF02).</div>`:''}
  `);
}

  const rows = list.map(r=>`

  state.form = { espacoId: espacoId||state.espacoSel, dia: dia||'Seg', slot: slot||SLOTS[0] };

      </div>

      <!-- verificação automática de conflito (heurística de prevenção de erros) -->
      <div class="rounded-xl p-3.5 text-sm flex items-start gap-2.5 ${conflito?'bg-if-red-50 text-if-red-700 ring-1 ring-red-200':'bg-if-green-50 text-if-green-700 ring-1 ring-if-green-100'}">

function enviarReserva(){
  const f=state.form;
  const titulo=(document.getElementById('reserva-titulo')?.value||state.form._titulo||'').trim()||'Reserva sem título';
  const dataMap = {Seg:'08/06/2026',Ter:'09/06/2026',Qua:'10/06/2026',Qui:'11/06/2026',Sex:'12/06/2026'};
  reservas.unshift({ id:uid('r'), espaco:f.espacoId, dia:f.dia, slot:f.slot, data:dataMap[f.dia], docente:state.user.id, titulo, status:'pendente', criada:'06/06 agora' });
  pushNotif('admin','inbox','Nova solicitação de reserva', `${titulo} — ${espacoNome(f.espacoId)} · ${f.dia} ${f.slot} · ${state.user.nome}`);
  pushNotif('docente','inbox','Solicitação recebida', `${titulo} — ${espacoNome(f.espacoId)} · ${f.dia} ${f.slot} entrou como pendente.`, state.user.id);
  closeModal();
  toast('Solicitação enviada','Sua reserva entrou como <strong>Pendente</strong> e aguarda análise.','ok');
  setTimeout(()=>toast('E-mail enviado ao administrador','Notificamos a equipe sobre o pedido “'+titulo+'”. (RF09)','mail'),700);
  go('minhas');
}
window.enviarReserva = enviarReserva;

  const r=reservas.find(x=>x.id===id); if(!r) return;
  openModal(`

      <h3 class="font-bold text-lg">Cancelar reserva?</h3>
      <p class="text-if-slate-600 text-sm mt-1">“${r.titulo}” em <strong>${espacoNome(r.espaco)}</strong> · ${r.dia} ${r.slot}. Esta ação libera o horário.</p>

function adminDashboard(){
  const pend = reservas.filter(r=>r.status==='pendente').length;
  const total = reservas.filter(r=>r.status!=='cancelada').length;
  const totalSlots = espacos.length*DIAS.length*SLOTS.length;
  let ocup=0; espacos.forEach(e=>DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') ocup++; })));
  const taxa = Math.round(ocup/totalSlots*100);
  return `
    ${pageHead('Painel administrativo','Visão geral da utilização dos espaços do campus.', `<button onclick="go('importar')" class="inline-flex items-center gap-2 bg-white ring-1 ring-if-slate-300 text-if-ink text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-if-slate-50">${icon('upload','w-4 h-4')} Importar horários</button>`)}
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard(pend,'Solicitações pendentes','inbox','if-amber')}
      ${statCard(espacos.length,'Espaços cadastrados','building')}
      ${statCard(taxa+'%','Taxa de ocupação','chart')}
      ${statCard(total,'Reservas ativas','calendar')}
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2">
        ${card(`
          <div class="px-5 py-4 border-b border-if-slate-100 flex items-center justify-between">
            <h2 class="font-bold">Solicitações aguardando análise</h2>
            <button onclick="go('solicitacoes')" class="text-sm font-semibold text-if-green-700 hover:underline">Abrir fila</button>
          </div>
          ${filaSolicitacoes(reservas.filter(r=>r.status==='pendente').slice(0,4))}
        `)}
      </div>
      <div>
        ${card(`
          <div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Ocupação por espaço</h2></div>
          <div class="p-5 space-y-3.5">${ocupacaoPorEspaco()}</div>
        `)}
      </div>
    </div>`;
}

function ocupacaoPorEspaco(){
  return espacos.map(e=>{
    let oc=0; DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') oc++; }));
    const pct=Math.round(oc/(DIAS.length*SLOTS.length)*100);
    return `<div>
      <div class="flex justify-between text-sm mb-1"><span class="font-medium text-if-slate-600 truncate pr-2">${e.nome}</span><span class="font-bold text-if-ink">${pct}%</span></div>
      <div class="h-2.5 rounded-full bg-if-slate-100 overflow-hidden"><div class="h-full bg-if-green rounded-full" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function adminRelatorios(){
  // uso por espaço
  const porEspaco = espacos.map(e=>{ let c=0; DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') c++; })); return {nome:e.nome, val:c}; });
  const maxE = Math.max(...porEspaco.map(x=>x.val),1);
  // uso por turno
  const turnos={'Manhã':0,'Tarde':0,'Noite':0};
  espacos.forEach(e=>DIAS.forEach(d=>SLOTS.forEach(s=>{ if(cellStatus(e.id,d,s)!=='livre') turnos[turno(s)]++; })));
  const maxT=Math.max(...Object.values(turnos),1);
  // status das reservas
  const stcount={aprovada:0,pendente:0,rejeitada:0,cancelada:0};
  reservas.forEach(r=>stcount[r.status]!==undefined&&stcount[r.status]++);
  const totalR=reservas.length||1;

  return `
    ${pageHead('Relatórios de utilização','Como os espaços foram usados ao longo do semestre, para apoiar o planejamento.', `<button onclick="exportarRel()" class="inline-flex items-center gap-2 bg-white ring-1 ring-if-slate-300 text-if-ink text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-if-slate-50">${icon('download','w-4 h-4')} Exportar PDF</button>`)}

      <span class="ml-auto inline-flex items-center gap-1.5 text-xs text-if-slate-500 bg-if-slate-50 ring-1 ring-if-slate-200 px-3 py-1.5 rounded-lg">${icon('filter','w-3.5 h-3.5')} Filtros aplicados</span>
    </div>

    <div class="grid lg:grid-cols-2 gap-6 mb-6">
      ${card(`<div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Horas/slots ocupados por espaço</h2></div>
        <div class="p-5 space-y-4">${porEspaco.map(x=>`
          <div><div class="flex justify-between text-sm mb-1.5"><span class="font-medium text-if-slate-600 truncate pr-2">${x.nome}</span><span class="font-bold">${x.val}</span></div>
          <div class="h-3 rounded-full bg-if-slate-100 overflow-hidden"><div class="h-full bg-if-green rounded-full" style="width:${x.val/maxE*100}%"></div></div></div>`).join('')}</div>`)}

      ${card(`<div class="px-5 py-4 border-b border-if-slate-100"><h2 class="font-bold">Ocupação por turno</h2></div>
        <div class="p-5">
          <div class="flex items-end justify-around gap-6" style="height:200px">

              <div class="flex flex-col items-center justify-end gap-2 flex-1 h-full">
                <div class="text-sm font-bold">${v}</div>
                <div class="w-full rounded-t-lg bg-if-green" style="height:${Math.max(v/maxT*150,6)}px"></div>
                <div class="text-xs font-semibold text-if-slate-500">${t}</div>
              </div>`).join('')}
          </div>
        </div>`)}

        <div class="flex items-center justify-between"><h3 class="font-bold text-lg">Entrar</h3><button onclick="closeModal()" class="text-if-slate-400 hover:text-if-ink">${icon('x')}</button></div>
        <p class="text-sm text-if-slate-500 mt-1 mb-5">Acesse com seu e-mail institucional.</p>
        <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">E-mail</label>
        <input value="docente@ifnmg.edu.br" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none mb-3" />
        <label class="block text-xs font-bold uppercase tracking-wide text-if-slate-500 mb-1.5">Senha</label>
        <input type="password" value="••••••••" class="w-full rounded-lg ring-1 ring-if-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-if-green outline-none mb-4" />
        <button onclick="closeModal();setRole('docente')" class="w-full bg-if-green hover:bg-if-green-600 text-white text-sm font-semibold px-4 py-2.5 rounded-lg">Entrar</button>
        <div class="relative my-5 text-center"><span class="text-xs text-if-slate-400 bg-white px-2 relative z-10">demonstração rápida</span><div class="absolute inset-x-0 top-1/2 h-px bg-if-slate-200"></div></div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="closeModal();setRole('docente')" class="text-sm font-semibold ring-1 ring-if-slate-300 hover:bg-if-slate-50 px-3 py-2.5 rounded-lg">Entrar como Docente</button>
          <button onclick="closeModal();setRole('admin')" class="text-sm font-semibold ring-1 ring-if-slate-300 hover:bg-if-slate-50 px-3 py-2.5 rounded-lg">Entrar como Admin</button>
        </div>
      </div>
    </div>`,'max-w-2xl');
}
