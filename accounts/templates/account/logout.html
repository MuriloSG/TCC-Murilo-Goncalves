{% extends "ui/layouts/auth.html" %}
{% load ui %}

{% block title %}Sair{% endblock %}

{% block content %}
  <div class="auth-heading">
    <h1>Sair do sistema?</h1>
    <p>A sessão neste navegador é encerrada. Para voltar, entre de novo com o e-mail e a senha.</p>
  </div>
  <form class="form-fields" method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <button class="btn-primary" type="submit">{% icon "log-out" %}Sair</button>
    <a class="btn-secondary" href="{% url 'home' %}">Fechar</a>
  </form>
{% endblock %}
