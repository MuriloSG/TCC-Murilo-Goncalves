x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-agendamento}
  POSTGRES_USER: ${POSTGRES_USER:-agendamento}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendamento}

services:
  db:
    image: postgres:17
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-somente-para-desenvolvimento-local}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-Agendamento IFNMG Salinas <nao-responda@localhost>}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-1}
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    build:
      context: .
      target: tailwind
    command: npx @tailwindcss/cli -i ui/styles/app.css -o ui/static/ui/css/app.css --watch=always
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
