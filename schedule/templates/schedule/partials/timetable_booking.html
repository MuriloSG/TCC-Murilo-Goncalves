{% load ui %}<div class="timetable-card is-booking">
  <p class="timetable-kind">{% icon "calendar-clock" "size-4" %}Agendamento</p>
  <p class="timetable-subject">{{ entry.description }}</p>
  <p class="timetable-line">{% icon "clock" "size-4" %}<span>Das {{ entry.start|time:"H:i" }} às {{ entry.end|time:"H:i" }}</span></p>
  {% if shows_requester and entry.requester %}<p class="timetable-line is-muted">{% icon "user-round" "size-4" %}<span>{{ entry.requester }}</span></p>{% endif %}
</div>
