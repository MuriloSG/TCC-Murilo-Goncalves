{% load ui %}{% for entry in cell.entries %}
  <div class="timetable-card {% if entry.is_undergraduate %}is-undergraduate{% else %}is-secondary{% endif %}">
    <p class="timetable-subject">{{ entry.subject }}</p>
    <p class="timetable-line">{% icon "users" "size-4" %}<span>{{ entry.group_label }}</span></p>
    {% if entry.teachers %}<p class="timetable-line is-muted">{% icon "user-round" "size-4" %}<span>{{ entry.teachers|join:", " }}</span></p>{% endif %}
  </div>
{% endfor %}
