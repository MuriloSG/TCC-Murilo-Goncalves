{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · IFAgenda</title>
  <link rel="icon" href="{% static 'ui/img/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" href="{% static 'ui/img/favicon-512.png' %}" sizes="512x512">
  <link rel="apple-touch-icon" href="{% static 'ui/img/apple-touch-icon.png' %}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'ui/css/app.css' %}">
  <script src="{% static 'ui/js/htmx.min.js' %}" defer></script>
  <script src="{% static 'ui/js/modal.js' %}" defer></script>
  <script src="{% static 'ui/js/menu.js' %}" defer></script>
  <script src="{% static 'ui/js/notifications.js' %}" defer></script>
  <script src="{% static 'ui/js/sidebar.js' %}" defer></script>
  <script src="{% static 'ui/js/checklist.js' %}" defer></script>
  <script src="{% static 'ui/js/select.js' %}" defer></script>
  <script src="{% static 'ui/js/reveal.js' %}" defer></script>
  <script src="{% static 'ui/js/counter.js' %}" defer></script>
  <script src="{% static 'ui/js/mask.js' %}" defer></script>
  <script src="{% static 'ui/js/expand.js' %}" defer></script>
  <script src="{% static 'ui/js/messages.js' %}" defer></script>
  <script src="{% static 'ui/js/busy.js' %}" defer></script>
  <script src="{% static 'ui/js/loading.js' %}" defer></script>
</head>
<body{% block body_attributes %}{% endblock %}>
  {% block body %}{% endblock %}
  <div id="modal"></div>
  {% include "ui/loading.html" %}
</body>
</html>
