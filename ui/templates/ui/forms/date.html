{% load ui %}<div class="date" data-date>{% include "django/forms/widgets/input.html" %}<button class="date-trigger" type="button" aria-label="Abrir calendário" aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ widget.attrs.id }}_calendario" hidden data-date-trigger>{% icon "calendar" %}</button><div class="date-panel" id="{{ widget.attrs.id }}_calendario" role="dialog" aria-label="Calendário" hidden data-date-panel></div><template data-date-prev>{% icon "chevron-left" "size-4" %}</template><template data-date-next>{% icon "chevron-right" "size-4" %}</template></div>
